name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        # 仓库不提交 package-lock.json（本环境跑不了 npm 同步 lock；且 Cloudflare Pages
        # 检测到 lock 会改用 npm ci，一旦 lock 与 package.json 失同步就直接失败）。
        # 一律用 npm install 按 package.json 解析安装，Cloudflare 同理走 npm install。
        run: npm install

      - name: 构建 (含 Pagefind 索引)
        run: npm run build

      - name: 站内死链检查
        run: npm run check:links

      - name: 构建体积预算
        run: node scripts/size-budget.mjs --max=8M
