name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖
        # 用 npm install 而非 npm ci：本地沙箱无法跑 npm 生成/同步 package-lock.json，
        # 而 package.json 已手动加入 devDependencies（@astrojs/check / typescript），
        # 旧 lock 文件失同步会让 npm ci 直接失败。npm install 按 package.json 解析安装即可。
        run: npm install

      - name: 类型与语法校验 (astro check)
        run: npm run astro:check

      - name: 构建 (含 Pagefind 索引)
        run: npm run build

      - name: 站内死链检查
        run: npm run check:links

      - name: 构建体积预算
        run: node scripts/size-budget.mjs --max=8M
